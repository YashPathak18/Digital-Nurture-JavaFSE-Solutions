<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Styling Demo</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

    <header>

        <h1 id="mainHeader">
            Local Community Event Portal
        </h1>

        <nav>

            <a href="#">Home</a>
            <a href="#">Events</a>
            <a href="#">Gallery</a>
            <a href="#">Contact</a>

        </nav>

    </header>

    <section id="welcomeBanner">

        <h2>
            Welcome to the Community Portal
        </h2>

        <p>
            Explore exciting community activities and programs.
        </p>

    </section>

    <section class="cardContainer">

        <div class="eventCard">

            <h3>Music Festival</h3>

            <p>
                Join the biggest local music celebration.
            </p>

        </div>

        <div class="eventCard">

            <h3>Community Marathon</h3>

            <p>
                Participate in our annual fitness marathon.
            </p>

        </div>

    </section>

    <section>

        <form>

            <h2>
                Registration Form
            </h2>

            <input type="text"
                   placeholder="Enter Name">

            <input type="email"
                   placeholder="Enter Email">

            <textarea placeholder="Message"></textarea>

            <button type="submit">
                Register
            </button>

        </form>

    </section>

</body>

</html>
