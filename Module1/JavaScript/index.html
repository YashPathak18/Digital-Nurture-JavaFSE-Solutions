<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JavaScript Community Portal</title>

</head>

<body>

    <h1 id="mainHeading">
        Local Community Event Portal
    </h1>

    <!-- Search -->

    <input type="text"
           id="searchInput"
           placeholder="Search Events">

    <button onclick="searchEvents()">
        Search
    </button>

    <hr>

    <!-- Event Container -->

    <div id="eventContainer"></div>

    <hr>

    <!-- Registration Form -->

    <form id="registrationForm">

        <input type="text"
               id="name"
               placeholder="Enter Name">

        <input type="email"
               id="email"
               placeholder="Enter Email">

        <button type="submit">
            Register
        </button>

    </form>

    <hr>

    <!-- Preferences -->

    <select id="preferredEvent">

        <option>Music Festival</option>
        <option>Community Marathon</option>
        <option>Tech Workshop</option>

    </select>

    <button onclick="savePreference()">
        Save Preference
    </button>

    <hr>

    <!-- Feedback -->

    <textarea id="feedbackText"
              placeholder="Enter Feedback"></textarea>

    <p>
        Characters:
        <span id="charCount">0</span>
    </p>

    <hr>

    <!-- Geolocation -->

    <button onclick="findNearbyEvents()">
        Find Nearby Events
    </button>

    <!-- JavaScript Files -->

    <script src="js/main.js"></script>

    <script src="js/events.js"></script>

    <script src="js/validation.js"></script>

    <script src="js/storage.js"></script>

    <script src="js/geolocation.js"></script>

    <script src="js/api.js"></script>

    <script src="js/dom.js"></script>

</body>

</html>
