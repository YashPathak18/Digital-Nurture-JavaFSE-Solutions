<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>

<body>

    <form>

        <input type="text"
               placeholder="Enter Name"
               required
               autofocus>

        <br><br>

        <input type="email"
               placeholder="Enter Email"
               required>

        <br><br>

        <input type="date">

        <br><br>

        <select>
            <option>Tech Meetup</option>
            <option>Music Festival</option>
        </select>

        <br><br>

        <textarea placeholder="Message"></textarea>

        <br><br>

        <button type="submit">
            Register
        </button>

        <br><br>

        <output>
            Registration Successful
        </output>

    </form>

</body>

</html>
