<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Register Event</title>

</head>

<body>

    <h1>
        Community Event Registration
    </h1>

    <form>

        <label>Full Name</label>

        <br>

        <input type="text"
               placeholder="Enter full name"
               required
               autofocus>

        <br><br>

        <label>Email Address</label>

        <br>

        <input type="email"
               placeholder="Enter email"
               required>

        <br><br>

        <label>Select Event</label>

        <br>

        <select>

            <option>Music Festival</option>
            <option>Community Marathon</option>
            <option>Food Carnival</option>

        </select>

        <br><br>

        <label>Message</label>

        <br>

        <textarea rows="5"
                  cols="40"
                  placeholder="Enter message"></textarea>

        <br><br>

        <button type="submit">

            Register

        </button>

        <br><br>

        <output>

            Registration Submitted

        </output>

    </form>

</body>

</html>
