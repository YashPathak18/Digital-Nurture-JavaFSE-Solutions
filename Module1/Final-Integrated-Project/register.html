<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Register</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="formContainer">

        <h1>
            Event Registration
        </h1>

        <form id="registrationForm">

            <input type="text"
                   id="name"
                   placeholder="Enter Name">

            <input type="email"
                   id="email"
                   placeholder="Enter Email">

            <select>

                <option>Music Festival</option>
                <option>Community Marathon</option>
                <option>Tech Workshop</option>

            </select>

            <textarea placeholder="Message"></textarea>

            <button type="submit">
                Register
            </button>

        </form>

    </div>

    <script src="js/validation.js"></script>

</body>

</html>
